# 离线部署：先 docker load 导入镜像，再在同目录 .env 中设置管理员密码。
# 新装先执行 docker volume create focusledger-data；升级时将 FOCUSLEDGER_DATA_VOLUME 设为旧卷实际名称。
services:
  server:
    image: ${FOCUSLEDGER_IMAGE:-focusledger-server:2026.10.18-r17}
    platform: linux/amd64
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${SERVER_PORT:-8080}:8080"
    environment:
      # 用户名默认 admin；自定义时限 3–40 位英文字母、数字、下划线、点或短横线。
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      # r4 起变更密码并重新部署后会同步到已有管理员；要求 12–256 个字符。
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请在同目录 .env 中设置 ADMIN_PASSWORD（12–256 个字符）}"
      RETENTION_DAYS: "${RETENTION_DAYS:-365}"
      SECURE_COOKIES: "${SECURE_COOKIES:-false}"
      DATA_DIR: /data
    volumes:
      - focus-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  focus-data:
    # 固定实际卷名，不随部署目录或 Compose 项目名变化；缺失时停止部署，避免自动使用空卷。
    name: ${FOCUSLEDGER_DATA_VOLUME:-focusledger-data}
    # 由部署者管理生命周期，docker compose down -v 也不会删除此卷。
    external: true
