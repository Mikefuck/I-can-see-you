{% macro live_apps(username='', scope='') %}
<section class="live-apps" data-live-apps data-live-person="{{ username }}" data-live-scope="{{ scope }}" aria-label="当前正在使用的前台应用">
  <div class="live-heading">
    <h2 class="label">当前应用<small>Live apps</small></h2>
    <p class="live-count" data-live-count role="status">正在读取状态…</p>
  </div>
  <div class="live-body">
    <p class="live-note" data-live-note>正在连接实时更新 · 每 10 秒定时校验</p>
    <ul class="live-list" data-live-list></ul>
  </div>
</section>
{% endmacro %}
