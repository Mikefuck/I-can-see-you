{#- Swiss railway station clock. The script turns the hands; the red second hand sweeps the dial
    in 58.5 s and rests at twelve until the minute hand jumps, like the platform clocks it copies. -#}
{% macro clock(class_name="", label="本机时间") -%}
<svg class="sbb {{ class_name }}" viewBox="0 0 100 100" role="img" aria-label="{{ label }}" data-sbb>
  <circle class="sbb-face" cx="50" cy="50" r="48.5"/>
  {%- for i in range(60) if i % 5 %}<rect class="sbb-min" x="49.45" y="4.5" width="1.1" height="3.6" transform="rotate({{ i * 6 }} 50 50)"/>{% endfor %}
  {%- for i in range(12) %}<rect class="sbb-hour" x="48.3" y="4.5" width="3.4" height="11.5" transform="rotate({{ i * 30 }} 50 50)"/>{% endfor %}
  <rect class="sbb-h" x="47.4" y="22" width="5.2" height="37" data-hand="h"/>
  <rect class="sbb-m" x="47.9" y="7.5" width="4.2" height="51.5" data-hand="m"/>
  <g class="sbb-s" data-hand="s"><rect x="49.35" y="19" width="1.3" height="47"/><circle cx="50" cy="20.5" r="5.4"/></g>
</svg>
{%- endmacro %}
